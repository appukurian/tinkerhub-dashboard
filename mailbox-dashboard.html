<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinkerHub Mailbox Dashboard</title>
<script src="dashboard-data.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1d212c;
    --border: #2a2f3d;
    --text: #e6e8ee;
    --muted: #9199ab;
    --accent: #6d8bff;
    --green: #3ecf8e;
    --amber: #f5b942;
    --red: #f2545b;
    --blue: #4aa3ff;
    --gray: #8a90a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  button.reload {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  button.reload:hover { background: var(--border); }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .num { font-size: 26px; font-weight: 700; }
  .card .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card.total .num { color: var(--text); }
  .card.no-response .num { color: var(--red); }
  .card.awaiting-us .num { color: var(--amber); }
  .card.awaiting-them .num { color: var(--blue); }
  .card.resolved .num { color: var(--green); }
  .card.informational .num { color: var(--gray); }

  section { margin-bottom: 28px; }
  h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 12px 0;
    font-weight: 600;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 13px;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    background: var(--panel-2);
    color: var(--muted);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  tr:last-child td { border-bottom: none; }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .filters select, .filters input {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  .filters input { flex: 1; min-width: 180px; }

  .status-pill {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .status-pill.no-response { background: rgba(242,84,91,0.15); color: var(--red); }
  .status-pill.awaiting-us { background: rgba(245,185,66,0.15); color: var(--amber); }
  .status-pill.awaiting-them { background: rgba(74,163,255,0.15); color: var(--blue); }
  .status-pill.resolved { background: rgba(62,207,142,0.15); color: var(--green); }
  .status-pill.informational { background: rgba(138,144,160,0.15); color: var(--gray); }

  .group-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    background: var(--panel-2);
    color: var(--muted);
    border: 1px solid var(--border);
    text-transform: capitalize;
  }

  a.link { color: var(--accent); text-decoration: none; font-size: 12.5px; }
  a.link:hover { text-decoration: underline; }

  .subject-cell { max-width: 340px; }
  .subject-cell .subj { font-weight: 500; }
  .subject-cell .note { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .actions { display: flex; gap: 10px; align-items: center; white-space: nowrap; }
  button.close-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  button.close-btn:hover { background: var(--border); color: var(--text); }

  .days-open { color: var(--muted); font-size: 12.5px; }
  .days-open.stale { color: var(--red); font-weight: 600; }

  .empty { color: var(--muted); padding: 24px; text-align: center; }
</style>
</head>
<body>

<header>
  <div>
    <h1>TinkerHub Mailbox Dashboard</h1>
    <div class="subtitle" id="generated-at">Loading…</div>
  </div>
  <button class="reload" onclick="location.reload()">↻ Reload</button>
</header>

<div class="cards" id="summary-cards"></div>

<section>
  <h2>Group Analytics</h2>
  <table id="analytics-table">
    <thead>
      <tr>
        <th>Group</th>
        <th>Total</th>
        <th>No response</th>
        <th>Awaiting (us)</th>
        <th>Awaiting (them)</th>
        <th>Resolved</th>
        <th>Informational</th>
        <th>Avg. days open</th>
        <th>Avg. days to resolve</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<section>
  <h2>Threads</h2>
  <div class="filters">
    <select id="filter-group">
      <option value="">All groups</option>
      <option value="campus">Campus</option>
      <option value="support">Support</option>
      <option value="finance">Finance</option>
      <option value="report">Report</option>
    </select>
    <select id="filter-status">
      <option value="">All statuses</option>
      <option value="No response">No response</option>
      <option value="Awaiting reply (from us)">Awaiting reply (from us)</option>
      <option value="Awaiting reply (from them)">Awaiting reply (from them)</option>
      <option value="Resolved">Resolved</option>
      <option value="Informational">Informational</option>
    </select>
    <input id="filter-text" type="text" placeholder="Search subject or counterpart…">
  </div>
  <table id="threads-table">
    <thead>
      <tr>
        <th>Group</th>
        <th>Subject</th>
        <th>Counterpart</th>
        <th>Received</th>
        <th>Last</th>
        <th>Status</th>
        <th>Days open</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<script>
function statusClass(status) {
  switch (status) {
    case "No response": return "no-response";
    case "Awaiting reply (from us)": return "awaiting-us";
    case "Awaiting reply (from them)": return "awaiting-them";
    case "Resolved": return "resolved";
    case "Informational": return "informational";
    default: return "";
  }
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function gmailThreadUrl(threadId) {
  return "https://mail.google.com/mail/u/0/#all/" + encodeURIComponent(threadId);
}

function openCloseCompose(t) {
  const to = t.email || "";
  const cc = (t.cc || []).join(",");
  const subject = "Re: " + t.subject;
  const body =
    "Hi,\n\n" +
    "Following up — this thread has been quiet for " + t.daysOpen + " day" + (t.daysOpen === 1 ? "" : "s") +
    " (since " + t.last + "), so I'm closing it out on our end.\n\n" +
    "If anything is still outstanding, please reply and we'll reopen it.\n\n" +
    "Thanks,\nTinkerHub";
  const params = new URLSearchParams({
    view: "cm",
    fs: "1",
    to: to,
    su: subject,
    body: body,
  });
  if (cc) params.set("cc", cc);
  const url = "https://mail.google.com/mail/?" + params.toString();
  window.open(url, "_blank");
}

function render() {
  const data = window.DASHBOARD_DATA;
  if (!data) {
    document.body.innerHTML = "<div class='empty'>No dashboard data found. Make sure dashboard-data.js is present.</div>";
    return;
  }

  document.getElementById("generated-at").textContent =
    "Last refreshed " + data.generatedAt + " · " + data.threads.length + " threads across the last 30 days";

  // Summary cards
  const order = ["No response", "Awaiting reply (from us)", "Awaiting reply (from them)", "Resolved", "Informational"];
  const cardClass = {
    "No response": "no-response",
    "Awaiting reply (from us)": "awaiting-us",
    "Awaiting reply (from them)": "awaiting-them",
    "Resolved": "resolved",
    "Informational": "informational",
  };
  const cardsEl = document.getElementById("summary-cards");
  let cardsHtml = `<div class="card total"><div class="num">${data.threads.length}</div><div class="label">Total threads</div></div>`;
  for (const status of order) {
    const count = data.summary[status] || 0;
    cardsHtml += `<div class="card ${cardClass[status]}"><div class="num">${count}</div><div class="label">${escapeHtml(status)}</div></div>`;
  }
  cardsEl.innerHTML = cardsHtml;

  // Analytics table
  const analyticsBody = document.querySelector("#analytics-table tbody");
  const groups = ["campus", "support", "finance", "report"];
  let rowsHtml = "";
  for (const g of groups) {
    const a = data.analytics[g];
    if (!a) continue;
    const sc = a.statusCounts || {};
    rowsHtml += `<tr>
      <td><span class="group-pill">${g}</span></td>
      <td>${a.total}</td>
      <td>${sc["No response"] || 0}</td>
      <td>${sc["Awaiting reply (from us)"] || 0}</td>
      <td>${sc["Awaiting reply (from them)"] || 0}</td>
      <td>${sc["Resolved"] || 0}</td>
      <td>${sc["Informational"] || 0}</td>
      <td>${a.avgOpenDays}</td>
      <td>${a.avgResolvedDays}</td>
    </tr>`;
  }
  analyticsBody.innerHTML = rowsHtml;

  // Threads table with filters
  const threadsBody = document.querySelector("#threads-table tbody");
  const filterGroup = document.getElementById("filter-group");
  const filterStatus = document.getElementById("filter-status");
  const filterText = document.getElementById("filter-text");

  function renderThreads() {
    let threads = data.threads.slice().sort((a, b) => (a.last < b.last ? 1 : a.last > b.last ? -1 : 0));

    const g = filterGroup.value;
    const s = filterStatus.value;
    const q = filterText.value.trim().toLowerCase();

    if (g) threads = threads.filter(t => t.group === g);
    if (s) threads = threads.filter(t => t.status === s);
    if (q) threads = threads.filter(t =>
      (t.subject || "").toLowerCase().includes(q) ||
      (t.counterpart || "").toLowerCase().includes(q)
    );

    if (threads.length === 0) {
      threadsBody.innerHTML = `<tr><td colspan="8" class="empty">No threads match these filters.</td></tr>`;
      return;
    }

    let html = "";
    for (const t of threads) {
      const canClose = t.status !== "Resolved" && t.status !== "Informational";
      const stale = t.daysOpen >= 7 && canClose;
      html += `<tr>
        <td><span class="group-pill">${escapeHtml(t.group)}</span></td>
        <td class="subject-cell">
          <div class="subj">${escapeHtml(t.subject)}</div>
          ${t.note ? `<div class="note">${escapeHtml(t.note)}</div>` : ""}
        </td>
        <td>${escapeHtml(t.counterpart)}</td>
        <td>${escapeHtml(t.received)}</td>
        <td>${escapeHtml(t.last)}</td>
        <td><span class="status-pill ${statusClass(t.status)}">${escapeHtml(t.status)}</span></td>
        <td><span class="days-open ${stale ? "stale" : ""}">${t.daysOpen}d</span></td>
        <td>
          <div class="actions">
            <a class="link" href="${gmailThreadUrl(t.threadId)}" target="_blank" rel="noopener">Open in Gmail</a>
            ${canClose ? `<button class="close-btn" data-id="${escapeHtml(t.id)}">Close…</button>` : ""}
          </div>
        </td>
      </tr>`;
    }
    threadsBody.innerHTML = html;

    threadsBody.querySelectorAll(".close-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const t = data.threads.find(x => x.id === btn.getAttribute("data-id"));
        if (t) openCloseCompose(t);
      });
    });
  }

  filterGroup.addEventListener("change", renderThreads);
  filterStatus.addEventListener("change", renderThreads);
  filterText.addEventListener("input", renderThreads);

  renderThreads();
}

render();
</script>

</body>
</html>
