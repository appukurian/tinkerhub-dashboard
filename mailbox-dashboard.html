<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinkerHub Mailbox Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card-border: #262b36;
    --text: #e8eaed;
    --text-dim: #9aa2b1;
    --accent: #6aa9ff;
    --green: #3ecf8e;
    --yellow: #e8b84b;
    --orange: #f0975a;
    --red: #f0615a;
    --purple: #b18cf0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 32px 64px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }
  .cards {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .num { font-size: 26px; font-weight: 700; }
  .card .label { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .card.total .num { color: var(--text); }
  .card.no-response .num { color: var(--red); }
  .card.awaiting-us .num { color: var(--orange); }
  .card.awaiting-them .num { color: var(--yellow); }
  .card.resolved .num { color: var(--green); }
  .card.info .num { color: var(--purple); }

  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 28px 0 10px;
  }

  table.analytics {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 13px;
    margin-bottom: 8px;
  }
  table.analytics th, table.analytics td {
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--card-border);
  }
  table.analytics th { color: var(--text-dim); font-weight: 500; font-size: 12px; }
  table.analytics tr:last-child td { border-bottom: none; }

  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .controls select, .controls input {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  .controls input { flex: 1; min-width: 180px; }
  #reloadBtn {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  #reloadBtn:hover { border-color: var(--accent); }

  .thread-list { display: flex; flex-direction: column; gap: 8px; }
  .thread {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 90px 1fr 170px 90px 90px 150px;
    gap: 12px;
    align-items: center;
    font-size: 13px;
  }
  .thread .grp {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }
  .thread .subj a { color: var(--text); text-decoration: none; font-weight: 500; }
  .thread .subj a:hover { color: var(--accent); text-decoration: underline; }
  .thread .subj .note { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .thread .counterpart { color: var(--text-dim); font-size: 12px; }
  .thread .days { text-align: right; color: var(--text-dim); font-size: 12px; }
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.no-response { background: rgba(240,97,90,0.15); color: var(--red); }
  .badge.awaiting-us { background: rgba(240,151,90,0.15); color: var(--orange); }
  .badge.awaiting-them { background: rgba(232,184,75,0.15); color: var(--yellow); }
  .badge.resolved { background: rgba(62,207,142,0.15); color: var(--green); }
  .badge.informational { background: rgba(177,140,240,0.15); color: var(--purple); }

  .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .actions a, .actions button {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text-dim);
    text-decoration: none;
    cursor: pointer;
  }
  .actions a:hover, .actions button:hover { color: var(--text); border-color: var(--accent); }

  .empty { color: var(--text-dim); text-align: center; padding: 40px; }

  @media (max-width: 900px) {
    .thread { grid-template-columns: 1fr; }
    .thread .days, .thread .counterpart { text-align: left; }
    .actions { justify-content: flex-start; }
    .cards { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<h1>TinkerHub Mailbox Dashboard</h1>
<div class="subtitle" id="generatedAt">Loading...</div>

<div class="cards" id="summaryCards"></div>

<div class="section-title">By Group</div>
<table class="analytics" id="analyticsTable"></table>

<div class="section-title">Threads</div>
<div class="controls">
  <select id="groupFilter">
    <option value="">All groups</option>
    <option value="campus">Campus</option>
    <option value="support">Support</option>
    <option value="finance">Finance</option>
    <option value="report">Report</option>
  </select>
  <select id="statusFilter">
    <option value="">All statuses</option>
    <option value="No response">No response</option>
    <option value="Awaiting reply (from us)">Awaiting reply (from us)</option>
    <option value="Awaiting reply (from them)">Awaiting reply (from them)</option>
    <option value="Resolved">Resolved</option>
    <option value="Informational">Informational</option>
  </select>
  <input type="text" id="searchBox" placeholder="Search subject or counterpart...">
  <button id="reloadBtn" onclick="location.reload()">Reload</button>
</div>

<div class="thread-list" id="threadList"></div>

<script src="dashboard-data.js"></script>
<script>
const STATUS_CLASS = {
  "No response": "no-response",
  "Awaiting reply (from us)": "awaiting-us",
  "Awaiting reply (from them)": "awaiting-them",
  "Resolved": "resolved",
  "Informational": "informational",
};

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function gmailThreadUrl(threadId) {
  return `https://mail.google.com/mail/u/0/#all/${threadId}`;
}

function gmailComposeUrl(thread) {
  const to = thread.email || "";
  const cc = (thread.cc || []).join(",");
  const su = `Re: ${thread.subject}`;
  const body = `Hi,\n\nThis thread has been quiet for ${thread.daysOpen} day${thread.daysOpen === 1 ? "" : "s"}, so we're closing it out on our end.\n\nPlease let us know if anything further is needed.\n\nThanks,\nTinkerHub`;
  const params = new URLSearchParams({ view: "cm", fs: "1", su, body });
  if (cc) params.set("cc", cc);
  return `https://mail.google.com/mail/?${params.toString()}&to=${encodeURIComponent(to)}`;
}

function renderSummary(summary) {
  const order = ["No response", "Awaiting reply (from us)", "Awaiting reply (from them)", "Resolved", "Informational"];
  const classMap = { "No response": "no-response", "Awaiting reply (from us)": "awaiting-us", "Awaiting reply (from them)": "awaiting-them", "Resolved": "resolved", "Informational": "info" };
  const total = Object.values(summary).reduce((a,b) => a+b, 0);
  let html = `<div class="card total"><div class="num">${total}</div><div class="label">Total threads</div></div>`;
  for (const key of order) {
    html += `<div class="card ${classMap[key]}"><div class="num">${summary[key] || 0}</div><div class="label">${esc(key)}</div></div>`;
  }
  document.getElementById("summaryCards").innerHTML = html;
}

function renderAnalytics(analytics) {
  let html = `<tr><th>Group</th><th>Total</th><th>No response</th><th>Awaiting (us)</th><th>Awaiting (them)</th><th>Resolved</th><th>Informational</th><th>Avg open (days)</th><th>Avg resolved (days)</th></tr>`;
  for (const group of ["campus", "support", "finance", "report"]) {
    const a = analytics[group];
    if (!a) continue;
    const c = a.counts || {};
    html += `<tr>
      <td style="text-transform:capitalize;font-weight:600;">${esc(group)}</td>
      <td>${a.total}</td>
      <td>${c["No response"] || 0}</td>
      <td>${c["Awaiting reply (from us)"] || 0}</td>
      <td>${c["Awaiting reply (from them)"] || 0}</td>
      <td>${c["Resolved"] || 0}</td>
      <td>${c["Informational"] || 0}</td>
      <td>${a.avgOpenDays}</td>
      <td>${a.avgResolvedDays}</td>
    </tr>`;
  }
  document.getElementById("analyticsTable").innerHTML = html;
}

function renderThreads(threads) {
  const groupFilter = document.getElementById("groupFilter").value;
  const statusFilter = document.getElementById("statusFilter").value;
  const search = document.getElementById("searchBox").value.trim().toLowerCase();

  let filtered = threads.filter(t => {
    if (groupFilter && t.group !== groupFilter) return false;
    if (statusFilter && t.status !== statusFilter) return false;
    if (search) {
      const hay = `${t.subject} ${t.counterpart}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => new Date(b.last) - new Date(a.last));

  const list = document.getElementById("threadList");
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">No threads match these filters.</div>`;
    return;
  }

  list.innerHTML = filtered.map(t => {
    const statusClass = STATUS_CLASS[t.status] || "";
    const canClose = t.status !== "Resolved" && t.status !== "Informational" && t.email;
    return `
      <div class="thread">
        <div class="grp">${esc(t.group)}</div>
        <div class="subj">
          <a href="${gmailThreadUrl(t.threadId)}" target="_blank" rel="noopener">${esc(t.subject)}</a>
          ${t.note ? `<div class="note">${esc(t.note)}</div>` : ""}
        </div>
        <div class="counterpart">${esc(t.counterpart)}</div>
        <div><span class="badge ${statusClass}">${esc(t.status)}</span></div>
        <div class="days">${t.daysOpen}d open</div>
        <div class="actions">
          <a href="${gmailThreadUrl(t.threadId)}" target="_blank" rel="noopener">Open in Gmail</a>
          ${canClose ? `<a href="${gmailComposeUrl(t)}" target="_blank" rel="noopener">Close&hellip;</a>` : ""}
        </div>
      </div>
    `;
  }).join("");
}

function init() {
  const data = window.DASHBOARD_DATA;
  if (!data) {
    document.getElementById("generatedAt").textContent = "No data loaded.";
    return;
  }
  document.getElementById("generatedAt").textContent = `Last refreshed: ${data.generatedAt}`;
  renderSummary(data.summary);
  renderAnalytics(data.analytics);
  renderThreads(data.threads);

  document.getElementById("groupFilter").addEventListener("change", () => renderThreads(data.threads));
  document.getElementById("statusFilter").addEventListener("change", () => renderThreads(data.threads));
  document.getElementById("searchBox").addEventListener("input", () => renderThreads(data.threads));
}

init();
</script>

</body>
</html>
