<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinkerHub Mailbox Dashboard</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --border: #e3e6ea;
    --text: #1c2126;
    --muted: #6b7280;
    --accent: #4f46e5;
    --green: #16a34a;
    --amber: #d97706;
    --red: #dc2626;
    --blue: #2563eb;
    --gray: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 32px 8px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { font-size: 22px; margin: 0; }
  header .meta { color: var(--muted); font-size: 13px; }
  .container { padding: 8px 32px 48px; max-width: 1200px; margin: 0 auto; }

  .summary-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin: 16px 0 28px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .num { font-size: 26px; font-weight: 700; }
  .card .label { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  .status-No-response .num { color: var(--red); }
  .status-Awaiting-reply-from-us .num { color: var(--amber); }
  .status-Awaiting-reply-from-them .num { color: var(--blue); }
  .status-Resolved .num { color: var(--green); }
  .status-Informational .num { color: var(--gray); }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 13.5px;
  }
  thead th {
    text-align: left;
    background: #fafbfc;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbff; }

  h2 { font-size: 16px; margin: 32px 0 12px; }

  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-No-response { background: #fde8e8; color: var(--red); }
  .badge-Awaiting-reply-from-us { background: #fef3e0; color: var(--amber); }
  .badge-Awaiting-reply-from-them { background: #e0e9ff; color: var(--blue); }
  .badge-Resolved { background: #e3f7e9; color: var(--green); }
  .badge-Informational { background: #eef0f2; color: var(--gray); }

  .group-pill {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    background: #f0f1f5;
    color: #444;
    text-transform: uppercase;
  }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 8px 0 16px;
  }
  .filters select, .filters input {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 13px;
    background: white;
  }
  .filters input { flex: 1; min-width: 180px; }

  a.subject-link { color: var(--accent); text-decoration: none; font-weight: 500; }
  a.subject-link:hover { text-decoration: underline; }

  .counterpart-name { font-weight: 500; }
  .counterpart-email { color: var(--muted); font-size: 12px; }

  .note { color: var(--muted); font-size: 12.5px; font-style: italic; }

  .days { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; }

  .btn-close {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-close:hover { background: #f5f5f7; border-color: #ccc; }
  .btn-open {
    display: inline-block;
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    margin-top: 2px;
  }

  .actions-cell { white-space: nowrap; }

  .analytics-table td, .analytics-table th { text-align: center; }
  .analytics-table td:first-child, .analytics-table th:first-child { text-align: left; }

  #empty-state {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>📬 TinkerHub Mailbox Dashboard</h1>
  <div class="meta">Last refreshed: <span id="generated-at">—</span> · <button onclick="location.reload()" style="cursor:pointer;border:1px solid var(--border);background:white;border-radius:6px;padding:4px 10px;font-size:12px;">Reload</button></div>
</header>

<div class="container">

  <div class="summary-cards" id="summary-cards"></div>

  <h2>Group Analytics</h2>
  <table class="analytics-table" id="analytics-table">
    <thead>
      <tr>
        <th>Group</th>
        <th>Total</th>
        <th>No response</th>
        <th>Awaiting (us)</th>
        <th>Awaiting (them)</th>
        <th>Resolved</th>
        <th>Informational</th>
        <th>Avg days open</th>
        <th>Avg days to resolve</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Threads</h2>
  <div class="filters">
    <select id="filter-group">
      <option value="">All groups</option>
      <option value="campus">Campus</option>
      <option value="support">Support</option>
      <option value="finance">Finance</option>
      <option value="report">Report</option>
    </select>
    <select id="filter-status">
      <option value="">All statuses</option>
      <option value="No response">No response</option>
      <option value="Awaiting reply (from us)">Awaiting reply (from us)</option>
      <option value="Awaiting reply (from them)">Awaiting reply (from them)</option>
      <option value="Resolved">Resolved</option>
      <option value="Informational">Informational</option>
    </select>
    <input id="filter-search" type="text" placeholder="Search subject or counterpart…">
  </div>

  <table id="threads-table">
    <thead>
      <tr>
        <th>Group</th>
        <th>Subject</th>
        <th>Counterpart</th>
        <th>Received</th>
        <th>Last activity</th>
        <th>Status</th>
        <th>Note</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="threads-body"></tbody>
  </table>
  <div id="empty-state">No threads match these filters.</div>

</div>

<script src="dashboard-data.js"></script>
<script>
(function() {
  const DATA = window.DASHBOARD_DATA || { generatedAt: '', threads: [], summary: {}, analytics: {} };

  document.getElementById('generated-at').textContent = DATA.generatedAt || '—';

  function slug(status) {
    return status.replace(/[^a-zA-Z]+/g, '-').replace(/^-|-$/g, '');
  }

  // Summary cards
  const statusOrder = ['No response', 'Awaiting reply (from us)', 'Awaiting reply (from them)', 'Resolved', 'Informational'];
  const summaryEl = document.getElementById('summary-cards');
  const totalThreads = DATA.threads.length;
  summaryEl.innerHTML = `<div class="card"><div class="num">${totalThreads}</div><div class="label">Total threads (30d)</div></div>` +
    statusOrder.map(s => {
      const count = DATA.summary[s] || 0;
      return `<div class="card status-${slug(s)}"><div class="num">${count}</div><div class="label">${s}</div></div>`;
    }).join('');

  // Analytics table
  const groups = ['campus', 'support', 'finance', 'report'];
  const analyticsBody = document.querySelector('#analytics-table tbody');
  analyticsBody.innerHTML = groups.map(g => {
    const a = DATA.analytics[g] || { total: 0, counts: {}, avgOpenDays: 0, avgResolvedDays: 0 };
    const c = a.counts || {};
    return `<tr>
      <td style="text-transform:capitalize;font-weight:600;">${g}</td>
      <td>${a.total || 0}</td>
      <td>${c['No response'] || 0}</td>
      <td>${c['Awaiting reply (from us)'] || 0}</td>
      <td>${c['Awaiting reply (from them)'] || 0}</td>
      <td>${c['Resolved'] || 0}</td>
      <td>${c['Informational'] || 0}</td>
      <td>${a.avgOpenDays ?? 0}d</td>
      <td>${a.avgResolvedDays ?? 0}d</td>
    </tr>`;
  }).join('');

  // Threads table
  const tbody = document.getElementById('threads-body');
  const emptyState = document.getElementById('empty-state');
  const filterGroup = document.getElementById('filter-group');
  const filterStatus = document.getElementById('filter-status');
  const filterSearch = document.getElementById('filter-search');

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function buildCloseHref(t) {
    const to = t.email || '';
    const cc = (t.cc || []).join(',');
    const subject = 'Re: ' + t.subject;
    const body = `Hi,\n\nFollowing up — this thread has been quiet for ${t.daysOpen} day(s), so we're closing it out on our end. Please reach back out if anything is still outstanding.\n\nThanks,\nTinkerHub`;
    const params = new URLSearchParams({
      view: 'cm',
      fs: '1',
      to: to,
      cc: cc,
      su: subject,
      body: body
    });
    return `https://mail.google.com/mail/?${params.toString()}`;
  }

  function render() {
    const g = filterGroup.value;
    const s = filterStatus.value;
    const q = filterSearch.value.trim().toLowerCase();

    let rows = DATA.threads.slice().sort((a, b) => (a.last < b.last ? 1 : a.last > b.last ? -1 : 0));

    rows = rows.filter(t => {
      if (g && t.group !== g) return false;
      if (s && t.status !== s) return false;
      if (q) {
        const hay = (t.subject + ' ' + t.counterpart + ' ' + (t.email || '')).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (rows.length === 0) {
      tbody.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    tbody.innerHTML = rows.map(t => {
      const gmailUrl = `https://mail.google.com/mail/u/0/#all/${t.threadId}`;
      const canClose = t.status !== 'Resolved' && t.status !== 'Informational';
      const closeBtn = canClose
        ? `<a class="btn-close" href="${buildCloseHref(t)}" target="_blank" rel="noopener">Close…</a>`
        : '';
      return `<tr>
        <td><span class="group-pill">${escapeHtml(t.group)}</span></td>
        <td>
          <a class="subject-link" href="${gmailUrl}" target="_blank" rel="noopener">${escapeHtml(t.subject)}</a><br>
          <a class="btn-open" href="${gmailUrl}" target="_blank" rel="noopener">Open in Gmail →</a>
        </td>
        <td>
          <div class="counterpart-name">${escapeHtml(t.counterpart)}</div>
          ${t.email ? `<div class="counterpart-email">${escapeHtml(t.email)}</div>` : ''}
        </td>
        <td class="days">${t.received}<br>(${t.daysSinceReceived}d ago)</td>
        <td class="days">${t.last}</td>
        <td><span class="badge badge-${slug(t.status)}">${escapeHtml(t.status)}</span></td>
        <td class="note">${escapeHtml(t.note || '')}</td>
        <td class="actions-cell">${closeBtn}</td>
      </tr>`;
    }).join('');
  }

  filterGroup.addEventListener('change', render);
  filterStatus.addEventListener('change', render);
  filterSearch.addEventListener('input', render);

  render();
})();
</script>

</body>
</html>
