name: Discord thread dashboard update

on:
  schedule:
    # Every 2 hours during the active window, 8am-11pm IST (UTC+5:30):
    # IST 8,10,12,14,16,18,20,22 -> UTC 2:30,4:30,6:30,8:30,10:30,12:30,14:30,16:30
    - cron: "30 2,4,6,8,10,12,14,16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Discord threads and build discord-data.js
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # Works whether these were added as repo Variables or Secrets.
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID || secrets.DISCORD_GUILD_ID }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || secrets.DISCORD_CHANNEL_ID }}
        run: python scripts/discord_update.py

      - name: Commit and push discord-data.js
        run: |
          git config user.name "TinkerHub Discord Dashboard Bot"
          git config user.email "actions@github.com"
          git add discord-data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Discord data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
