name: TinkerHub events map dashboard update

on:
  schedule:
    # Every 3 hours, so "today's activities" stays reasonably fresh.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch events from Metabase and build events-data.js
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
        run: python scripts/metabase_events_update.py

      - name: Commit and push events-data.js + geocode-cache.json
        run: |
          git config user.name "TinkerHub Dashboard Bot"
          git config user.email "actions@github.com"
          git add events-data.js geocode-cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Events data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
