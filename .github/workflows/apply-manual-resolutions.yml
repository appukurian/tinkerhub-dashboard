name: Apply manual thread resolutions

# Runs whenever manual-resolutions.json is pushed, OR manually via the
# GitHub Actions UI (workflow_dispatch). Also triggered alongside the
# daily Discord update, so the two always stay in sync.
on:
  push:
    paths:
      - "manual-resolutions.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply manual resolutions to dashboard-data.js
        run: python scripts/apply_manual_resolutions.py

      - name: Commit and push patched dashboard-data.js
        run: |
          git config user.name "TinkerHub Dashboard Bot"
          git config user.email "actions@github.com"
          git add dashboard-data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply manual resolutions to dashboard-data.js $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
